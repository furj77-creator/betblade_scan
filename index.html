<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beyblade X Quick Priority Scan</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; overflow: hidden; }

    #video-container { position: relative; width: 100vw; height: 100vh; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* 掃瞄框指引 + 結果卡片：由上而下排列，結果卡片會顯示在綠框下面 */
    .overlay {
      position: absolute; top: 18%; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      pointer-events: none; z-index: 5;
    }
    .scan-box {
      width: 88vw; height: 34vw; max-width: 380px; max-height: 150px;
      border: 3px dashed #00ffcc; border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    /* 結果卡片：置於掃瞄框正下方 */
    #result-card {
      width: 90vw; max-width: 380px;
      padding: 16px; border-radius: 16px; text-align: center;
      transition: all 0.2s ease; display: none; background: #222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10;
      max-height: 40vh; overflow-y: auto; border: 2px solid rgba(255,255,255,0.2);
      pointer-events: auto;
    }
    #result-model { font-size: 32px; font-weight: 900; letter-spacing: 1px; }
    #result-price { font-size: 20px; font-weight: 700; margin-top: 2px; opacity: 0.95; }
    #result-priority { font-size: 24px; font-weight: 800; margin: 4px 0 8px 0; text-transform: uppercase; }
    #result-note { font-size: 15px; line-height: 1.4; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 8px; text-align: left; }

    /* 各 Priority 顏色定義 */
    .bg-very-high { background: #1b5e20 !important; border-color: #4caf50 !important; color: #ffffff; } /* Very High 綠色 */
    .bg-high      { background: #0d47a1 !important; border-color: #2196f3 !important; color: #ffffff; } /* High 藍色 */
    .bg-medium    { background: #e65100 !important; border-color: #ff9800 !important; color: #ffffff; } /* Medium 黃橙色 */
    .bg-low       { background: #424242 !important; border-color: #9e9e9e !important; color: #e0e0e0; } /* Low 灰色 */

    #status { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 8px; font-size: 12px; z-index: 10; }
  </style>
</head>
<body>

<div id="video-container">
  <video id="webcam" autoplay playsinline muted></video>

  <div class="overlay">
    <div class="scan-box"></div>
    <div id="result-card">
      <div id="result-model">--</div>
      <div id="result-price">--</div>
      <div id="result-priority">--</div>
      <div id="result-note">--</div>
    </div>
  </div>

  <div id="status">正在同步 Google Sheet 資料...</div>
</div>

<script>
  const SHEET_ID = '1wNFpe9U1bgbRGtU6uNlpkpFgrX-ictuisUpOLDqbmG4';
  let dbData = {};
  let isProcessing = false;
  let worker = null;

  // 1. 從 Google Sheet 抓取最新 Price / Priority 資料
  //    Sheet 內有兩個並排表格：A-D 欄（Model / Retail Price / Priority / notes）
  //    及 H-K 欄（Model / Retail Price / Priority / notes），兩邊都要讀取
  async function fetchSheetData() {
    try {
      const response = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
      const text = await response.text();
      const json = JSON.parse(text.substring(47, text.length - 2));

      const rows = json.table.rows;
      const blocks = [
        { model: 0, price: 1, priority: 2, note: 3 },  // A, B, C, D
        { model: 7, price: 8, priority: 9, note: 10 }  // H, I, J, K
      ];

      rows.forEach(row => {
        if (!row.c) return;
        blocks.forEach(b => {
          const modelCell = row.c[b.model];
          if (!modelCell || modelCell.v === null || modelCell.v === undefined) return;

          const model = String(modelCell.v).trim().toUpperCase();
          if (!(model.includes('BX') || model.includes('UX') || model.includes('CX'))) return;

          const priceCell = row.c[b.price];
          const priorityCell = row.c[b.priority];
          const noteCell = row.c[b.note];

          const price = (priceCell && priceCell.v !== null && priceCell.v !== undefined) ? priceCell.v : null;
          const priority = (priorityCell && priorityCell.v) ? String(priorityCell.v).trim() : 'Low';
          const note = (noteCell && noteCell.v) ? String(noteCell.v).trim() : '';

          // 統一格式為標準 BX-XX / UX-XX / CX-XX 鍵值
          const cleanKey = model.replace(/[^A-Z0-9]/g, '');
          dbData[cleanKey] = { rawModel: model, price, priority, note };
        });
      });

      document.getElementById('status').innerText = '✅ 清單已同步 (已載入 ' + Object.keys(dbData).length + ' 款模型)';
    } catch (e) {
      document.getElementById('status').innerText = '❌ 同步失敗，請確認 Sheet 權限';
    }
  }

  // 2. 開啟高清鏡頭
  async function startCamera() {
    const video = document.getElementById('webcam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        initOCR(video);
      };
    } catch (err) {
      alert('無法存取相機，請允許相機權限！');
    }
  }

  // 3. 初始化 OCR 引擎
  async function initOCR(video) {
    worker = await Tesseract.createWorker('eng');
    // 只對英文字母、數字和連字號做辨識，大幅提升速度與準確度
    await worker.setParameters({
      tessedit_char_whitelist: 'BXUXCXbxuxcx-0123456789',
      // Sparse text：盒面上文字排版鬆散、方向不一，用 sparse text 模式
      // 比預設的整段落模式更容易在鬆散版面上抓到型號字串
      tessedit_pageseg_mode: '11',
    });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    setInterval(async () => {
      if (isProcessing || !worker) return;
      isProcessing = true;

      // 擴大擷取範圍（比綠框大一些），減少「一定要精準對準型號」的要求，
      // 只要盒面大致落在畫面中央就能掃到
      const boxWidth = video.videoWidth * 0.9;
      const boxHeight = video.videoHeight * 0.45;
      const startX = (video.videoWidth - boxWidth) / 2;
      const startY = (video.videoHeight - boxHeight) / 2;

      // 放大 2 倍再做辨識，提高小字/細字的辨識率
      const scale = 2;
      canvas.width = boxWidth * scale;
      canvas.height = boxHeight * scale;

      ctx.drawImage(video, startX, startY, boxWidth, boxHeight, 0, 0, canvas.width, canvas.height);

      // 影像增強：提高對比度 (二值化處理，讓文字更清晰)
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // 依畫面平均亮度動態調整二值化門檻，適應不同光源/包裝底色
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) {
        sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
      }
      const avgBrightness = sum / (data.length / 4);
      const threshold = Math.min(160, Math.max(90, avgBrightness - 20));

      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const color = avg > threshold ? 255 : 0; // 黑白化
        data[i] = color;
        data[i + 1] = color;
        data[i + 2] = color;
      }
      ctx.putImageData(imgData, 0, 0);

      const { data: { text } } = await worker.recognize(canvas);
      processOCRText(text);

      isProcessing = false;
    }, 350); // 每 0.35 秒掃瞄一次
  }

  // 4. 解析辨識文字並對比清單
  function processOCRText(ocrText) {
    if (!ocrText) return;
    const cleanText = ocrText.replace(/[^A-Z0-9]/gi, '').toUpperCase();

    // 匹配 BX09, UX03, CX11, BX-09, UX-03 等格式（容許無連字號）
    const match = cleanText.match(/(BX|UX|CX)\d{2}/);

    if (match) {
      const detectedKey = match[0]; // e.g. "BX09"

      if (dbData[detectedKey]) {
        const item = dbData[detectedKey];
        showResult(item.rawModel, item.price, item.priority, item.note);
      }
    }
  }

  // 5. 渲染 UI 與 Priority 顏色
  function showResult(model, price, priority, note) {
    const card = document.getElementById('result-card');
    const modelEl = document.getElementById('result-model');
    const priceEl = document.getElementById('result-price');
    const priorityEl = document.getElementById('result-priority');
    const noteEl = document.getElementById('result-note');

    modelEl.innerText = model;
    priceEl.innerText = (price !== null && price !== undefined && price !== '')
      ? `原價：¥${Number(price).toLocaleString()}`
      : '原價：--';
    priorityEl.innerText = priority;
    noteEl.innerText = note ? `備註：${note}` : '（無備註）';

    // 重置背景顏色 Class
    card.className = '';
    const prioLower = priority.toLowerCase();

    if (prioLower.includes('very high')) {
      card.classList.add('bg-very-high');
    } else if (prioLower.includes('high')) {
      card.classList.add('bg-high');
    } else if (prioLower.includes('medium')) {
      card.classList.add('bg-medium');
    } else {
      card.classList.add('bg-low');
    }

    card.style.display = 'block';
  }

  fetchSheetData();
  startCamera();
</script>
</body>
</html>
