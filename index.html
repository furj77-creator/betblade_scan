<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beyblade X Quick Priority Scan</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    #video-container { position: relative; width: 100vw; height: 100vh; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 掃瞄框指引 */
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .scan-box {
      width: 75vw; height: 35vw; max-width: 320px; max-height: 150px;
      border: 3px dashed rgba(255, 255, 255, 0.7); border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
    }
    .instruction { margin-top: 15px; font-size: 14px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px; }

    /* 實時結果卡片 */
    #result-card {
      position: absolute; bottom: 30px; left: 5%; width: 90%;
      padding: 20px; border-radius: 16px; text-align: center;
      transition: all 0.2s ease; display: none; background: #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #result-model { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    #result-priority { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    #result-note { font-size: 14px; opacity: 0.9; }

    /* 顏色定義 */
    .bg-very-high { background: #2e7d32 !important; color: #fff; } /* Very High */
    .bg-high { background: #1565c0 !important; color: #fff; }      /* High */
    .bg-medium { background: #f57f17 !important; color: #fff; }    /* Medium */
    .bg-low { background: #616161 !important; color: #fff; }       /* Low */

    #status { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>

<div id="video-container">
  <video id="webcam" autoplay playsinline muted></video>
  
  <div class="overlay">
    <div class="scan-box"></div>
    <div class="instruction">對準盒面型號（如 BX-09 / UX-03）</div>
  </div>

  <div id="status">正在同步 Google Sheet 資料...</div>

  <div id="result-card">
    <div id="result-model">--</div>
    <div id="result-priority">--</div>
    <div id="result-note">--</div>
  </div>
</div>

<script>
  // 你的 Google Sheet ID
  const SHEET_ID = '1wNFpe9U1bgbRGtU6uNlpkpFgrX-ictuisUpOLDqbmG4';
  let dbData = {}; 
  let isProcessing = false;

  // 1. 從 Google Sheet 自動取得最新 Priority 數據
  async function fetchSheetData() {
    try {
      const response = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
      const text = await response.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      
      const rows = json.table.rows;
      // 解析內容並轉為內部字典
      rows.forEach(row => {
        if (row.c && row.c[0] && row.c[0].v) {
          const model = String(row.c[0].v).trim().toUpperCase(); // A 欄: Model
          const priority = row.c[3] ? String(row.c[3].v).trim() : 'Low'; // D 欄: Priority
          const note = row.c[1] ? String(row.c[1].v).trim() : '';
          
          if (model.startsWith('BX-') || model.startsWith('UX-')) {
            dbData[model] = { priority, note };
          }
        }
      });
      document.getElementById('status').innerText = '✅ 清單同步完成 (已載入 ' + Object.keys(dbData).length + ' 款模型)';
    } catch (e) {
      document.getElementById('status').innerText = '❌ 同步失敗，請檢查 Sheet 權限';
    }
  }

  // 2. 開啟鏡頭
  async function startCamera() {
    const video = document.getElementById('webcam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        startOCR(video);
      };
    } catch (err) {
      alert('無法存取相機，請確保已給予權限！');
    }
  }

  // 3. 實時文字辨識 (OCR)
  async function startOCR(video) {
    const worker = await Tesseract.createWorker('eng');
    
    // 建立 Canvas 擷取畫面
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    setInterval(async () => {
      if (isProcessing) return;
      isProcessing = true;

      canvas.width = video.videoWidth / 2;  // 降解析度提高辨識速度
      canvas.height = video.videoHeight / 2;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const { data: { text } } = await worker.recognize(canvas);
      processOCRText(text);

      isProcessing = false;
    }, 400); // 每 0.4 秒辨識一次
  }

  // 4. 對照型號並即時更新 UI
  function processOCRText(ocrText) {
    const cleanText = ocrText.replace(/\s+/g, '').toUpperCase();
    
    // 搜尋文字中是否有 BX-XX 或 UX-XX 格式
    const match = cleanText.match(/(BX|UX)-\d{2}/);
    
    if (match) {
      const detectedModel = match[0];
      const result = dbData[detectedModel];

      if (result) {
        showResult(detectedModel, result.priority, result.note);
      }
    }
  }

  // 顯示結果
  function showResult(model, priority, note) {
    const card = document.getElementById('result-card');
    const modelEl = document.getElementById('result-model');
    const priorityEl = document.getElementById('result-priority');
    const noteEl = document.getElementById('result-note');

    modelEl.innerText = model;
    priorityEl.innerText = priority.toUpperCase();
    noteEl.innerText = note || '';

    card.className = '';
    const prioLower = priority.toLowerCase();
    if (prioLower.includes('very high')) card.classList.add('bg-very-high');
    else if (prioLower.includes('high')) card.classList.add('bg-high');
    else if (prioLower.includes('medium')) card.classList.add('bg-medium');
    else card.classList.add('bg-low');

    card.style.display = 'block';
  }

  // 初始化
  fetchSheetData();
  startCamera();
</script>
</body>
</html>
