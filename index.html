<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beyblade X Quick Priority Scan</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; overflow: hidden; }
    
    #video-container { position: relative; width: 100vw; height: 100vh; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 掃瞄框指引 - 提高集中度 */
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .scan-box {
      width: 80vw; height: 30vw; max-width: 340px; max-height: 130px;
      border: 3px dashed #00ffcc; border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
    }
    .instruction { margin-top: 12px; font-size: 14px; background: rgba(0,0,0,0.8); padding: 6px 14px; border-radius: 20px; color: #00ffcc; font-weight: bold; }

    /* 結果卡片：移至中上方 (Top 12%)，避免被遮擋 */
    #result-card {
      position: absolute; top: 12%; left: 5%; width: 90%;
      padding: 16px; border-radius: 16px; text-align: center;
      transition: all 0.2s ease; display: none; background: #222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10;
      max-height: 35vh; overflow-y: auto; border: 2px solid rgba(255,255,255,0.2);
    }
    #result-model { font-size: 32px; font-weight: 900; letter-spacing: 1px; }
    #result-priority { font-size: 24px; font-weight: 800; margin: 4px 0 8px 0; text-transform: uppercase; }
    #result-note { font-size: 15px; line-height: 1.4; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 8px; text-align: left; }

    /* 各 Priority 顏色定義 */
    .bg-very-high { background: #1b5e20 !important; border-color: #4caf50 !important; color: #ffffff; } /* Very High 綠色 */
    .bg-high      { background: #0d47a1 !important; border-color: #2196f3 !important; color: #ffffff; } /* High 藍色 */
    .bg-medium    { background: #e65100 !important; border-color: #ff9800 !important; color: #ffffff; } /* Medium 黃橙色 */
    .bg-low       { background: #424242 !important; border-color: #9e9e9e !important; color: #e0e0e0; } /* Low 灰色 */

    #status { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 8px; font-size: 12px; z-index: 10; }
  </style>
</head>
<body>

<div id="video-container">
  <video id="webcam" autoplay playsinline muted></video>
  
  <div class="overlay">
    <div class="scan-box"></div>
    <div class="instruction">將盒上型號（如 BX-09）對準綠框</div>
  </div>

  <div id="status">正在同步 Google Sheet 資料...</div>

  <div id="result-card">
    <div id="result-model">--</div>
    <div id="result-priority">--</div>
    <div id="result-note">--</div>
  </div>
</div>

<script>
  const SHEET_ID = '1wNFpe9U1bgbRGtU6uNlpkpFgrX-ictuisUpOLDqbmG4';
  let dbData = {}; 
  let isProcessing = false;
  let worker = null;

  // 1. 從 Google Sheet 抓取最新 Priority 資料
  async function fetchSheetData() {
    try {
      const response = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
      const text = await response.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      
      const rows = json.table.rows;
      rows.forEach(row => {
        if (row.c && row.c[0] && row.c[0].v) {
          const model = String(row.c[0].v).trim().toUpperCase();
          const note = row.c[1] ? String(row.c[1].v).trim() : '';
          const priority = row.c[3] ? String(row.c[3].v).trim() : 'Low';
          
          if (model.includes('BX') || model.includes('UX')) {
            // 統一格式為標準 BX-XX 或 UX-XX 鍵值
            const cleanKey = model.replace(/[^A-Z0-9]/g, '');
            dbData[cleanKey] = { rawModel: model, priority, note };
          }
        }
      });
      document.getElementById('status').innerText = '✅ 清單已同步 (已載入 ' + Object.keys(dbData).length + ' 款模型)';
    } catch (e) {
      document.getElementById('status').innerText = '❌ 同步失敗，請確認 Sheet 權限';
    }
  }

  // 2. 開啟高清鏡頭
  async function startCamera() {
    const video = document.getElementById('webcam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        initOCR(video);
      };
    } catch (err) {
      alert('無法存取相機，請允許相機權限！');
    }
  }

  // 3. 初始化 OCR 引擎
  async function initOCR(video) {
    worker = await Tesseract.createWorker('eng');
    // 只對英文字母、數字和連字號做辨識，大幅提升速度與準確度
    await worker.setParameters({
      tessedit_char_whitelist: 'BXUXbxux-0123456789',
    });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    setInterval(async () => {
      if (isProcessing || !worker) return;
      isProcessing = true;

      // 只擷取綠色框框內的畫面，提高解析度與辨識率
      const boxWidth = video.videoWidth * 0.7;
      const boxHeight = video.videoHeight * 0.25;
      const startX = (video.videoWidth - boxWidth) / 2;
      const startY = (video.videoHeight - boxHeight) / 2;

      canvas.width = boxWidth;
      canvas.height = boxHeight;

      // 裁切綠框區域並繪製到 canvas
      ctx.drawImage(video, startX, startY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);

      // 影像增強：提高對比度 (二值化處理，讓文字更清晰)
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const color = avg > 110 ? 255 : 0; // 黑白化
        data[i] = color;
        data[i + 1] = color;
        data[i + 2] = color;
      }
      ctx.putImageData(imgData, 0, 0);

      const { data: { text } } = await worker.recognize(canvas);
      processOCRText(text);

      isProcessing = false;
    }, 350); // 每 0.35 秒掃瞄一次
  }

  // 4. 解析辨識文字並對比清單
  function processOCRText(ocrText) {
    if (!ocrText) return;
    const cleanText = ocrText.replace(/[^A-Z0-9]/gi, '').toUpperCase();
    
    // 匹配 BX09, UX03, BX-09, UX-03 等格式
    const match = cleanText.match(/(BX|UX)\d{2}/);
    
    if (match) {
      const detectedKey = match[0]; // e.g. "BX09"
      
      if (dbData[detectedKey]) {
        const item = dbData[detectedKey];
        showResult(item.rawModel, item.priority, item.note);
      }
    }
  }

  // 5. 渲染 UI 與 Priority 顏色
  function showResult(model, priority, note) {
    const card = document.getElementById('result-card');
    const modelEl = document.getElementById('result-model');
    const priorityEl = document.getElementById('result-priority');
    const noteEl = document.getElementById('result-note');

    modelEl.innerText = model;
    priorityEl.innerText = priority;
    noteEl.innerText = note ? `備註：${note}` : '（無備註）';

    // 重置背景顏色 Class
    card.className = '';
    const prioLower = priority.toLowerCase();

    if (prioLower.includes('very high')) {
      card.classList.add('bg-very-high');
    } else if (prioLower.includes('high')) {
      card.classList.add('bg-high');
    } else if (prioLower.includes('medium')) {
      card.classList.add('bg-medium');
    } else {
      card.classList.add('bg-low');
    }

    card.style.display = 'block';
  }

  fetchSheetData();
  startCamera();
</script>
</body>
</html>
